import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
    id 'org.jetbrains.changelog'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

intellijPlatform {}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    intellijPlatform {
        // todo: how recent should this be? Does this imply that we support exactly this version? Or is this the latest plugin version, so to speak?
        intellijIdea '2025.3.6.1'
        testFramework TestFrameworkType.Platform.INSTANCE
        /*
        // using bundledPlugin() only works if you stick to gradle 9.7.1 or lower
        bundledPlugin("com.intellij.java")
        bundledPlugin("JUnit")
        
         */
    }
}
